<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <title>BioRecruit assessment pipeline</title>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker></defs>
  <rect width="960" height="400" rx="12" fill="#ffffff"/>
  <text x="480" y="32" text-anchor="middle" font-size="19" font-weight="600" fill="#111827">Every application, same four steps, then a human</text>
  <g font-size="13" fill="#111827">
    <rect x="20" y="80" width="130" height="64" rx="8" fill="#f3f4f6" stroke="#9ca3af"/><text x="85" y="106" text-anchor="middle">CV (PDF) +</text><text x="85" y="124" text-anchor="middle">application text</text>
    <rect x="180" y="70" width="160" height="84" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/><text x="260" y="94" text-anchor="middle" font-weight="600">Guard: inspect</text><text x="260" y="114" text-anchor="middle" font-size="11">hidden text, invisible Unicode,</text><text x="260" y="130" text-anchor="middle" font-size="11">AI-aimed instructions,</text><text x="260" y="146" text-anchor="middle" font-size="11">redact personal data</text>
    <rect x="370" y="70" width="160" height="84" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="450" y="94" text-anchor="middle" font-weight="600">AI: extract facts</text><text x="450" y="114" text-anchor="middle" font-size="11">cleaned text as data,</text><text x="450" y="130" text-anchor="middle" font-size="11">each signal with a quote,</text><text x="450" y="146" text-anchor="middle" font-size="11">borderline: majority of 3</text>
    <rect x="560" y="70" width="160" height="84" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="640" y="94" text-anchor="middle" font-weight="600">Scoring rules</text><text x="640" y="114" text-anchor="middle" font-size="11">deterministic code,</text><text x="640" y="130" text-anchor="middle" font-size="11">quotes verified,</text><text x="640" y="146" text-anchor="middle" font-size="11">capped on injection</text>
    <rect x="750" y="70" width="190" height="84" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/><text x="845" y="94" text-anchor="middle" font-weight="600">Guard: cross-check</text><text x="845" y="114" text-anchor="middle" font-size="11">reported facts must appear</text><text x="845" y="130" text-anchor="middle" font-size="11">in the visible text</text>

    <rect x="370" y="210" width="350" height="96" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="545" y="236" text-anchor="middle" font-weight="600">Human reviewer decides</text><text x="545" y="258" text-anchor="middle" font-size="12">own view recorded before seeing the AI's</text><text x="545" y="276" text-anchor="middle" font-size="12">AI may suggest a rejection; only a person</text><text x="545" y="294" text-anchor="middle" font-size="12">who opened the CV can reject</text>
    <rect x="20" y="340" width="920" height="40" rx="8" fill="#f3f4f6" stroke="#6b7280"/><text x="480" y="365" text-anchor="middle">Append-only audit log: model snapshot, prompt version, guard version + rules hash, input hash, reviewer decision and reasons</text>
    <rect x="20" y="210" width="300" height="96" rx="10" fill="#ffffff" stroke="#6b7280" stroke-dasharray="5 4"/><text x="170" y="236" text-anchor="middle" font-weight="600">Bias lab (separate)</text><text x="170" y="258" text-anchor="middle" font-size="12">calls the same assessment interface</text><text x="170" y="276" text-anchor="middle" font-size="12">with fictional CVs and swapped</text><text x="170" y="294" text-anchor="middle" font-size="12">names and attributes</text>
  </g>
  <g stroke="#4b5563" stroke-width="1.5" fill="none" marker-end="url(#a)">
    <line x1="150" y1="112" x2="178" y2="112"/><line x1="340" y1="112" x2="368" y2="112"/><line x1="530" y1="112" x2="558" y2="112"/><line x1="720" y1="112" x2="748" y2="112"/>
    <path d="M845,154 L845,180 L545,180 L545,208"/>
    <path d="M320,240 L352,240 L352,56 L262,56 L262,68" stroke-dasharray="5 4"/>
  </g>
</svg>
