<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title>Language effect before and after a fix</title>
<rect width="720" height="360" rx="12" fill="#ffffff"/>
<text x="360.0" y="32" text-anchor="middle" font-size="17" font-weight="600" fill="#111827">Language effect: non-native vs fluent English, same CV</text>
<line x1="230.0" y1="70" x2="230.0" y2="290" stroke="#e5e7eb"/>
<text x="230.0" y="308" font-size="11" text-anchor="middle" fill="#6b7280">-8</text>
<line x1="332.5" y1="70" x2="332.5" y2="290" stroke="#e5e7eb"/>
<text x="332.5" y="308" font-size="11" text-anchor="middle" fill="#6b7280">-6</text>
<line x1="435.0" y1="70" x2="435.0" y2="290" stroke="#e5e7eb"/>
<text x="435.0" y="308" font-size="11" text-anchor="middle" fill="#6b7280">-4</text>
<line x1="537.5" y1="70" x2="537.5" y2="290" stroke="#e5e7eb"/>
<text x="537.5" y="308" font-size="11" text-anchor="middle" fill="#6b7280">-2</text>
<line x1="640.0" y1="70" x2="640.0" y2="290" stroke="#e5e7eb"/>
<text x="640.0" y="308" font-size="11" text-anchor="middle" fill="#6b7280">0</text>
<line x1="640.0" y1="70" x2="640.0" y2="290" stroke="#111827"/>
<text x="216" y="134" font-size="13" text-anchor="end" fill="#111827">Before fix (n = 102)</text>
<line x1="276.125" y1="130" x2="465.75" y2="130" stroke="#2563eb" stroke-width="3"/>
<circle cx="373.5" cy="130" r="6" fill="#2563eb"/>
<text x="373.5" y="116" font-size="12" text-anchor="middle" fill="#1e3a8a">-5.2 [-7.1, -3.4]</text>
<text x="216" y="234" font-size="13" text-anchor="end" fill="#111827">After fix (full run, n = 510)</text>
<line x1="506.75" y1="230" x2="588.75" y2="230" stroke="#2563eb" stroke-width="3"/>
<circle cx="547.75" cy="230" r="6" fill="#2563eb"/>
<text x="547.75" y="216" font-size="12" text-anchor="middle" fill="#1e3a8a">-1.8 [-2.6, -1.0]</text>
<text x="435.0" y="330" font-size="12" text-anchor="middle" fill="#111827">Score difference, points (mean, 95% CI)</text>
<text x="360.0" y="350" font-size="11" text-anchor="middle" fill="#6b7280">Fictional CVs, fictional company. Reduced, not removed.</text>
</svg>
